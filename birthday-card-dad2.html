.relight{pointer-events:auto;margin-top:6px;font:inherit;font-size:20px;padding:0 14px;border:2px solid var(--ink);background:#f6efde;color:var(--ink);border-radius:18px;cursor:pointer}
.back{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:12px;font:inherit;font-size:22px;padding:2px 14px;border:2px solid var(--ink);background:#f6efde;color:var(--ink);border-radius:20px;cursor:pointer;display:none;z-index:20}
.back.show{display:block}
