function blowOut(){isOut=true;flames.forEach(function(f){f.classList.add('out')});$('wt').textContent='make a wish, '+NAME+' ✨';$('wish').classList.add('show');confetti();setTimeout(function(){setFlames(0)},300)}
function relight(){isOut=false;blowT=0;flames.forEach(function(f){f.classList.remove('out')});$('wish').classList.remove('show');setFlames(0)}
$('relight').onclick=relight;
function loop(t){raf=requestAnimationFrame(loop);var dt=Math.min(.1,(t-last)/1000||0);last=t;var m=0;
 if(an){an.getFloatTimeDomainData(buf);var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];var r=Math.sqrt(s/buf.length);base=base*.995+Math.min(r,base*1.5+.002)*.005;m=Math.max(0,Math.min(1,(r-base)*9))}
 if(holdOn)m=Math.max(m,.85);
 level=level*.6+m*.4;$('mi').style.width=(level*100)+'%';
 if(!isOut){setFlames(level);if(level>.3)blowT+=dt;else blowT=Math.max(0,blowT-dt*2);if(blowT>=.5)blowOut()}}
function startMic(){var n=$('note');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){n.style.display='block';n.textContent='Mic needs https — host this page (not file://). Use “hold to blow” or the spacebar instead.';return}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){stream=s;ctx=new(window.AudioContext||window.webkitAudioContext)();var src=ctx.createMediaStreamSource(s);an=ctx.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);src.connect(an);$('ml').textContent='blow into your mic';n.style.display='none'}).catch(function(){n.style.display='block';n.textContent='Mic is blocked — use “hold to blow” or the spacebar.'})}

var cv=$('cf'),g=cv.getContext('2d'),ps=[],cr=0;
function confetti(){cv.width=innerWidth;cv.height=innerHeight;var cols=['#d9534f','#f0ad4e','#8fa86a','#f6efde','#e8a0a0','#c9a574'];for(var i=0;i<160;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6,s:4+Math.random()*6,c:cols[i%6],l:1});if(!cr)cr=requestAnimationFrame(cfl)}
function cfl(){g.clearRect(0,0,cv.width,cv.height);ps=ps.filter(function(p){return p.l>0&&p.y<cv.height+20});ps.forEach(function(p){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.l-=.006;g.save();g.globalAlpha=Math.max(0,p.l);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});cr=ps.length?requestAnimationFrame(cfl):0;if(!ps.length)g.clearRect(0,0,cv.width,cv.height)}
